spring:
  application:
    name: finflow

  r2dbc:
    url: r2dbc:postgresql://localhost:5432/finflow
    username: finflow
    password: finflow

  flyway:
    url: jdbc:postgresql://localhost:5432/finflow
    user: finflow
    password: finflow
    locations: classpath:db/migration

server:
  port: 8080

finflow:
  jwt:
    secret: change-me-in-env
    expiry-minutes: 60
  llm:
    provider: groq
